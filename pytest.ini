[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    functional: Functional and UI tests (E2E, smoke, sanity)
    security: Security and vulnerability tests (SQLi, XSS, auth bypass)
    performance: Performance, stress, spike, and reliability tests
    usability: Accessibility, compliance, and usability tests
    specialized: Mobile compatibility and infrastructure integrity tests
    smoke: Quick sanity and critical path smoke tests
    e2e: Complete end-to-end user workflows
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
